<!-- @template name="SHADIEZ Landing Starter" description="Warm Bright-Coast landing seed: frosted nav, full-bleed hero, colorway selector and lead CTA." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SHADIEZ — Something New Under The Sun</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./ds-base.js"></script>
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--cream); }
  @keyframes tRise { from { transform: translateY(118%); } to { transform: translateY(0); } }
  @keyframes tFade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { [style*="tRise"], [style*="tFade"] { animation: none !important; opacity: 1 !important; transform: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
function start() {
  const NS = window.SHADIEZDesignSystem_4d9f8a;
  if (!NS || !window.React || !window.ReactDOM) return setTimeout(start, 30);
  const { Logo, Button, Badge, ColorwayPicker, SpecRow, Dialog, Field, Input, SHADIEZ_COLORWAYS } = NS;

  const PHOTOS = [
    "../../assets/colorways/cw-cream.jpg","../../assets/colorways/cw-coral.jpg","../../assets/colorways/cw-butter.jpg",
    "../../assets/colorways/cw-dusty-blue.jpg","../../assets/colorways/cw-navy-stripe.jpg","../../assets/colorways/cw-burgundy-stripe.jpg","../../assets/colorways/cw-pinstripe.jpg"
  ];

  function App() {
    const [lead, setLead] = React.useState(false);
    const [scrolled, setScrolled] = React.useState(false);
    const [i, setI] = React.useState(0);
    React.useEffect(() => {
      const on = () => setScrolled(window.scrollY > window.innerHeight * 0.7);
      on(); window.addEventListener("scroll", on, { passive: true });
      return () => window.removeEventListener("scroll", on);
    }, []);
    const name = SHADIEZ_COLORWAYS[i].key;
    const flood = SHADIEZ_COLORWAYS[i].dot;

    return (
      <React.Fragment>
        {/* NAV */}
        <header style={{ position: "fixed", inset: "0 0 auto 0", zIndex: 50, transition: "background .4s, backdrop-filter .4s, box-shadow .4s",
          background: scrolled ? "rgba(251,247,240,.72)" : "transparent", backdropFilter: scrolled ? "blur(16px) saturate(1.4)" : "none",
          WebkitBackdropFilter: scrolled ? "blur(16px) saturate(1.4)" : "none", boxShadow: scrolled ? "var(--shadow-sm)" : "none" }}>
          <nav style={{ maxWidth: 1280, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "20px 32px" }}>
            <span style={{ color: scrolled ? "var(--ink)" : "var(--cream)", transition: "color .4s" }}><Logo size={19} /></span>
            <Button variant={scrolled ? "primary" : "glass"} size="sm" onClick={() => setLead(true)}>Contact us</Button>
          </nav>
        </header>

        {/* HERO */}
        <section style={{ position: "relative", minHeight: "100svh", display: "flex", alignItems: "flex-end", overflow: "hidden" }}>
          <img src="../../assets/lifestyle/beach-recline.jpg" alt="A SHADIEZ sun-shade on a bright beach" style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }} />
          <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, rgba(35,32,28,.34) 0%, rgba(35,32,28,0) 32%, rgba(35,32,28,.7) 100%)" }} />
          <div style={{ position: "relative", zIndex: 2, maxWidth: 1280, width: "100%", margin: "0 auto", padding: "0 32px 72px", color: "var(--cream)" }}>
            <h1 style={{ fontFamily: "var(--font-serif)", fontWeight: 700, fontSize: "clamp(48px,9vw,128px)", lineHeight: .92, letterSpacing: "-.035em", margin: 0, color: "var(--cream)", textShadow: "0 2px 40px rgba(35,32,28,.45)" }}>
              <span style={{ display: "block", overflow: "hidden" }}><span style={{ display: "block", animation: "tRise 1.4s cubic-bezier(.22,1,.36,1) .2s both" }}>Something New</span></span>
              <span style={{ display: "block", overflow: "hidden", fontStyle: "italic" }}><span style={{ display: "block", animation: "tRise 1.4s cubic-bezier(.22,1,.36,1) .42s both" }}>Under The Sun</span></span>
            </h1>
            <div style={{ display: "flex", alignItems: "center", gap: 22, marginTop: 32, animation: "tFade 1s ease-out 1.1s both" }}>
              <Button variant="warm" size="lg" onClick={() => setLead(true)}>Shop the Shade</Button>
              <span style={{ fontFamily: "var(--font-body)", fontSize: 15, opacity: .92 }}>Your shade. Anywhere.</span>
            </div>
          </div>
        </section>

        {/* COLORWAY SELECTOR */}
        <section style={{ padding: "clamp(80px,12vw,150px) 0", transition: "background .7s cubic-bezier(.22,1,.36,1)", background: `color-mix(in srgb, ${flood} 26%, var(--cream))` }}>
          <div style={{ maxWidth: 1280, margin: "0 auto", padding: "0 32px", display: "grid", gridTemplateColumns: "1.5fr 1fr", gap: 48, alignItems: "center" }}>
            <div style={{ position: "relative", aspectRatio: "16 / 11", borderRadius: "var(--radius-sm)", overflow: "hidden", border: "1px solid var(--border)", boxShadow: "var(--shadow-card)" }}>
              {PHOTOS.map((p, idx) => (
                <img key={idx} src={p} alt={"SHADIEZ shade — " + SHADIEZ_COLORWAYS[idx].key}
                  style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover", opacity: idx === i ? 1 : 0, transition: "opacity .8s cubic-bezier(.22,1,.36,1)" }} />
              ))}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
              <Badge tone="wood" uppercase>The spectrum</Badge>
              <h2 style={{ fontFamily: "var(--font-serif)", fontWeight: 700, fontSize: "clamp(30px,3.4vw,48px)", lineHeight: 1.0, letterSpacing: "-.025em", margin: 0 }}>Seven canvases.<br/>One is yours.</h2>
              <ColorwayPicker value={i} onChange={(idx) => setI(idx)} swatchSize={34} />
              <SpecRow items={["Solid walnut", "Folds flat", "Up in seconds"]} />
              <Button variant="ink" size="lg" onClick={() => setLead(true)} style={{ alignSelf: "flex-start" }}>Shop {name}</Button>
            </div>
          </div>
        </section>

        {/* LEAD DIALOG */}
        <Dialog open={lead} onClose={() => setLead(false)} title="Get in touch" description="Leave your details and we'll get back to you shortly."
          footer={<Button variant="primary" fullWidth onClick={() => setLead(false)}>Send message</Button>}>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <Field label="Name" htmlFor="tn" required><Input id="tn" /></Field>
            <Field label="Email" htmlFor="te" required><Input id="te" type="email" /></Field>
          </div>
        </Dialog>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
start();
</script>
</body>
</html>
