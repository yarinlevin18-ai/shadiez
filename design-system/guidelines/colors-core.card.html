<!-- @dsCard group="Colors" viewport="700x250" name="Brand core — Bright Coast" subtitle="Walnut, cream, canvas, sand, ink — the warm foundation" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--cream); padding: 24px; font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 88px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .name { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .hex { font-size: 11.5px; color: var(--ink-60); letter-spacing: .02em; }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--wood)"></div><span class="name">Wood</span><span class="hex">#8E5330</span></div>
  <div class="sw"><div class="chip" style="background:var(--wood-deep)"></div><span class="name">Wood deep</span><span class="hex">#623722</span></div>
  <div class="sw"><div class="chip" style="background:var(--cream)"></div><span class="name">Cream</span><span class="hex">#FBF7F0</span></div>
  <div class="sw"><div class="chip" style="background:var(--canvas)"></div><span class="name">Canvas</span><span class="hex">#F8F6EF</span></div>
  <div class="sw"><div class="chip" style="background:var(--sand)"></div><span class="name">Sand</span><span class="hex">#ECE3D4</span></div>
  <div class="sw"><div class="chip" style="background:var(--ink)"></div><span class="name">Ink</span><span class="hex">#23201C</span></div>
  <div class="sw"><div class="chip" style="background:var(--ink-60)"></div><span class="name">Ink 60</span><span class="hex">#6B6256</span></div>
</div>
</body>
</html>
