<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--cream); padding: 28px; font-family: var(--font-body); color: var(--ink); }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--wood); }
  .lead { font-size: 20px; line-height: 1.45; max-width: 52ch; margin: 12px 0 0; color: var(--ink); }
  .body { font-size: 15px; line-height: 1.6; max-width: 56ch; margin: 12px 0 0; color: var(--ink-60); }
  .labels { display: flex; gap: 16px; margin-top: 16px; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-60); }
</style>
</head>
<body>
<div class="eyebrow">The object</div>
<p class="lead">A portable personal beach sun-shade — walnut frame, cream canvas, adjustable recline.</p>
<p class="body">You don't sit in it; it shades you. Folds flat, sets up in seconds, carries on the shoulder.</p>
<div class="labels"><span>Name *</span><span>Email *</span><span>Phone · optional</span></div>
</body>
</html>
