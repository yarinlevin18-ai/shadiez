<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--ink); padding: 0; font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; height: 260px; }
  .grid figure { margin: 0; position: relative; overflow: hidden; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cap { position: absolute; left: 12px; bottom: 10px; color: var(--cream); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div class="grid">
  <figure><img src="../assets/lifestyle/beach-recline.jpg" alt="A woman reclines in the shade of a SHADIEZ on a sunny beach"/><span class="cap">Lifestyle · in-use</span></figure>
  <figure><img src="../assets/details/notch-pin.png" alt="Brass pivot pin and notched recline detail"/><span class="cap">Craft detail</span></figure>
  <figure><img src="../assets/lifestyle/golden-hour.png" alt="Two SHADIEZ shades at golden hour"/><span class="cap">Golden hour</span></figure>
</div>
</body>
</html>
