<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--cream); padding: 28px; font-family: var(--font-body); color: var(--ink); }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; color: var(--wood); }
  .head { font-family: var(--font-serif); font-weight: 700; font-size: 38px; line-height: .98; letter-spacing: -.02em; margin: 10px 0 0; }
  .head em { font-style: italic; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 28px; margin-top: 22px; }
  .do, .dont { font-size: 13.5px; line-height: 1.5; }
  .k { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-60); display: block; margin-bottom: 6px; }
  .do span { color: var(--success); font-weight: 700; }
  .dont span { color: var(--error); font-weight: 700; }
</style>
</head>
<body>
<div class="eyebrow">Something new</div>
<div class="head">Something New <em>Under</em> The Sun.</div>
<div class="grid">
  <div class="do"><span class="k">Say</span><span>✓</span> "Your own patch of shade." &nbsp; <span>✓</span> "Folds flat. Sets up in seconds." &nbsp; <span>✓</span> "Shop the Shade."</div>
  <div class="dont"><span class="k">Never</span><span>✕</span> "the last beach chair you'll buy!" &nbsp; <span>✕</span> emoji, hype, exclamation headlines, or the word "chair."</div>
</div>
</body>
</html>
