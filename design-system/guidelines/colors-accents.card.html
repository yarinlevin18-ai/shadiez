<!-- @dsCard group="Colors" viewport="700x250" name="Accents & CTA" subtitle="Amber/sun CTA, navy CTA, dusty-blue accents" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--cream); padding: 24px; font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 88px; border-radius: var(--radius-sm); border: 1px solid var(--border); display: flex; align-items: flex-end; padding: 8px; }
  .role { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  .name { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .hex { font-size: 11.5px; color: var(--ink-60); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--amber)"><span class="role" style="color:#3A2A12">CTA · warm</span></div><span class="name">Amber</span><span class="hex">#E8A04A</span></div>
  <div class="sw"><div class="chip" style="background:var(--sun)"><span class="role" style="color:#3A2A12">Flood / sun</span></div><span class="name">Sun</span><span class="hex">#F4B23D</span></div>
  <div class="sw"><div class="chip" style="background:var(--navy)"><span class="role" style="color:#F1E6CB">CTA · solid</span></div><span class="name">Navy</span><span class="hex">#1F3A5F</span></div>
  <div class="sw"><div class="chip" style="background:var(--accent-blue)"><span class="role" style="color:#fff">Accent</span></div><span class="name">Dusty blue</span><span class="hex">#768D9F</span></div>
  <div class="sw"><div class="chip" style="background:var(--sky)"><span class="role" style="color:#3A2A12">Soft accent</span></div><span class="name">Sky</span><span class="hex">#C3D6DC</span></div>
</div>
</body>
</html>
