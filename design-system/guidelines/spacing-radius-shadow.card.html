<!-- @dsCard group="Spacing" viewport="700x200" name="Radius & shadow" subtitle="Square 4px house corner; one pill; warm shadows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--cream); padding: 26px; font-family: var(--font-body); color: var(--ink); }
  .wrap { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 86px; height: 64px; background: var(--canvas); border: 1px solid var(--border); }
  .name { font-size: 11px; color: var(--ink-60); }
  .sh1 { box-shadow: var(--shadow-sm); border: none; }
  .sh2 { box-shadow: var(--shadow-card); border: none; }
  .sh3 { box-shadow: var(--shadow-cta); background: var(--navy); border: none; }
  .sh4 { box-shadow: var(--shadow-warm); background: var(--amber); border: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="name">sm · 4px</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><span class="name">md · 6px</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="name">pill · 100</span></div>
  <div class="col"><div class="box sh1" style="border-radius:var(--radius-sm)"></div><span class="name">shadow-sm</span></div>
  <div class="col"><div class="box sh2" style="border-radius:var(--radius-sm)"></div><span class="name">shadow-card</span></div>
  <div class="col"><div class="box sh3" style="border-radius:var(--radius-sm)"></div><span class="name">shadow-cta</span></div>
  <div class="col"><div class="box sh4" style="border-radius:var(--radius-pill)"></div><span class="name">shadow-warm</span></div>
</div>
</body>
</html>
