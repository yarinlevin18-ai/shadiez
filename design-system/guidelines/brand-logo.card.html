<!-- @dsCard group="Brand" viewport="700x230" name="Logo lockup" subtitle="Wave-mark + wordmark + diamond, three colorways" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-serif); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; }
  .cell { height: 230px; display: flex; align-items: center; justify-content: center; gap: .5em; }
  .ink { background: var(--cream); color: var(--ink); }
  .dark { background: var(--ink); color: var(--cream); }
  .wood { background: var(--sand); color: var(--wood); }
  .amber { background: var(--amber); color: var(--ink); }
  .lock { display: inline-flex; align-items: center; gap: .5em; font-weight: 300; font-size: 30px; text-transform: uppercase; letter-spacing: 0.22em; }
  .lock img { height: .82em; width: auto; }
  .diamond { width: .3em; height: .3em; transform: rotate(45deg); background: currentColor; display: inline-block; }
</style>
</head>
<body>
<div class="grid">
  <div class="cell ink"><span class="lock"><img src="../assets/logo/wavemark-ink.svg" alt=""/>SHADIEZ<span class="diamond"></span></span></div>
  <div class="cell dark"><span class="lock"><img src="../assets/logo/wavemark-cream.svg" alt=""/>SHADIEZ<span class="diamond"></span></span></div>
  <div class="cell wood"><span class="lock"><img src="../assets/logo/wavemark-wood.svg" alt=""/>SHADIEZ<span class="diamond"></span></span></div>
  <div class="cell amber"><span class="lock"><img src="../assets/logo/wavemark-ink.svg" alt=""/>SHADIEZ<span class="diamond"></span></span></div>
</div>
</body>
</html>
