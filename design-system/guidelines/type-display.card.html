<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--cream); padding: 28px; font-family: var(--font-display); color: var(--ink); }
  .big { font-size: 56px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.0; }
  .meta { font-family: var(--font-body); font-size: 12px; color: var(--ink-60); letter-spacing: .04em; margin-bottom: 14px; }
  .scale { display: flex; gap: 18px; align-items: baseline; margin-top: 14px; flex-wrap: wrap; }
  .scale span { font-weight: 600; }
</style>
</head>
<body>
<div class="meta">SCHIBSTED GROTESK · 500 / 600 / 700 · headings &amp; UI</div>
<div class="big">Built like furniture.</div>
<div class="scale">
  <span style="font-weight:500">Medium 500</span>
  <span style="font-weight:600">Semibold 600</span>
  <span style="font-weight:700">Bold 700</span>
  <span style="font-weight:800">Black 800</span>
</div>
</body>
</html>
