<!-- @dsCard group="Landing" viewport="1280x900" name="SHADIEZ Landing Page" subtitle="Full storytelling landing — hero → object → colorway selector → lifestyle → CTA + lead dialog" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SHADIEZ — Something New Under The Sun</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--cream); }
  @keyframes heroRise { from { transform: translateY(118%); } to { transform: translateY(0); } }
  @keyframes heroZoom { from { transform: scale(1.08); } to { transform: scale(1); } }
  @keyframes heroFade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes scrollCue { 0%,100% { opacity: .3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) {
    [style*="heroRise"], [style*="heroZoom"], [style*="heroFade"] { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Object.jsx"></script>
<script type="text/babel" src="Colorways.jsx"></script>
<script type="text/babel" src="Lifestyle.jsx"></script>
<script type="text/babel" src="FinalCta.jsx"></script>
<script type="text/babel" data-presets="react">
(() => {

function LeadDialog({ open, onClose }) {
  const { Dialog, Field, Input, Button } = window.SHADIEZDesignSystem_4d9f8a;
  const [status, setStatus] = React.useState("idle");
  React.useEffect(() => { if (!open) { const t = setTimeout(() => setStatus("idle"), 250); return () => clearTimeout(t); } }, [open]);
  const submit = (e) => {
    e.preventDefault();
    setStatus("submitting");
    setTimeout(() => setStatus("success"), 900);
  };
  return (
    <Dialog open={open} onClose={onClose}
      title={status === "success" ? "Message sent." : "Get in touch"}
      description={status === "success" ? "Thanks for reaching out — we'll be in touch shortly." : "Leave your details and we'll get back to you shortly."}>
      {status !== "success" && (
        <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Field label="Name" htmlFor="ln" required><Input id="ln" autoComplete="name" /></Field>
          <Field label="Email" htmlFor="le" required><Input id="le" type="email" autoComplete="email" /></Field>
          <Field label="Phone" htmlFor="lp" optional><Input id="lp" type="tel" autoComplete="tel" /></Field>
          <Button type="submit" variant="primary" fullWidth disabled={status === "submitting"}>
            {status === "submitting" ? "Sending…" : "Send message"}
          </Button>
          <p style={{ textAlign: "center", fontFamily: "var(--font-body)", fontSize: 11, color: "rgba(35,32,28,.45)", margin: 0 }}>No spam. Unsubscribe any time.</p>
        </form>
      )}
    </Dialog>
  );
}

function App() {
  const [lead, setLead] = React.useState(false);
  const [scrolled, setScrolled] = React.useState(false);
  React.useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > window.innerHeight * 0.7);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const openLead = () => setLead(true);
  return (
    <React.Fragment>
      <window.Nav onContact={openLead} scrolled={scrolled} />
      <window.Hero onShop={openLead} />
      <window.ObjectSection onShop={openLead} />
      <window.Colorways onShop={openLead} />
      <window.Lifestyle />
      <window.FinalCta onShop={openLead} />
      <LeadDialog open={lead} onClose={() => setLead(false)} />
    </React.Fragment>
  );
}

function mount() {
  if (!(window.Nav && window.Hero && window.ObjectSection && window.Colorways && window.Lifestyle && window.FinalCta && window.SHADIEZDesignSystem_4d9f8a)) {
    return setTimeout(mount, 30);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
mount();
})();
</script>
</body>
</html>
