<!-- @dsCard group="Type" viewport="700x240" name="Editorial serif — Fraunces" subtitle="The magazine voice + the wordmark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--cream); padding: 28px; color: var(--ink); }
  .meta { font-family: var(--font-body); font-size: 12px; color: var(--ink-60); letter-spacing: .04em; margin-bottom: 14px; }
  .ed { font-family: var(--font-serif); font-weight: 700; font-size: 50px; line-height: 0.95; letter-spacing: -0.02em; }
  .ed em { font-style: italic; font-weight: 600; }
  .word { margin-top: 22px; font-family: var(--font-serif); font-weight: 300; font-size: 26px; text-transform: uppercase; letter-spacing: 0.22em; display: inline-flex; align-items: center; gap: .5em; }
  .diamond { width: .3em; height: .3em; transform: rotate(45deg); background: var(--amber); display: inline-block; margin-left: .1em; }
</style>
</head>
<body>
<div class="meta">FRAUNCES · editorial display &amp; wordmark · italic accent words</div>
<div class="ed">Your own <em>patch</em> of shade.</div>
<div class="word">SHADIEZ<span class="diamond"></span></div>
</body>
</html>
