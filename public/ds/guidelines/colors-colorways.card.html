<!-- @dsCard group="Colors" viewport="700x230" name="Canvas colorways" subtitle="The seven real product canvas hues" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--cream); padding: 24px; font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
  .sw { display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
  .dot { width: 100%; aspect-ratio: 1; border-radius: 999px; border: 1px solid rgba(35,32,28,.18); box-shadow: inset 0 2px 6px rgba(0,0,0,.12); }
  .name { font-size: 12px; font-weight: 600; color: var(--ink); }
  .hex { font-size: 10.5px; color: var(--ink-60); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="dot" style="background:var(--cw-cream)"></div><span class="name">Cream</span><span class="hex">#F3E9D2</span></div>
  <div class="sw"><div class="dot" style="background:var(--cw-coral)"></div><span class="name">Coral</span><span class="hex">#E68A6B</span></div>
  <div class="sw"><div class="dot" style="background:var(--cw-butter)"></div><span class="name">Butter</span><span class="hex">#ECC74F</span></div>
  <div class="sw"><div class="dot" style="background:var(--cw-dusty-blue)"></div><span class="name">Dusty Blue</span><span class="hex">#9DBAD0</span></div>
  <div class="sw"><div class="dot" style="background:var(--cw-navy)"></div><span class="name">Navy</span><span class="hex">#2F517A</span></div>
  <div class="sw"><div class="dot" style="background:var(--cw-burgundy)"></div><span class="name">Burgundy</span><span class="hex">#8E454C</span></div>
  <div class="sw"><div class="dot" style="background:var(--cw-pinstripe)"></div><span class="name">Pinstripe</span><span class="hex">#C9C2B4</span></div>
</div>
</body>
</html>
