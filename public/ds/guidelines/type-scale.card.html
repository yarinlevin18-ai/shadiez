<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Hero → caption, fluid display" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--cream); padding: 26px; color: var(--ink); }
  .r { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--hairline); }
  .r:last-child { border-bottom: none; }
  .tok { font-family: var(--font-body); font-size: 11px; color: var(--ink-60); width: 130px; flex-shrink: 0; letter-spacing: .02em; }
  .ex { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
</style>
</head>
<body>
  <div class="r"><span class="tok">--text-display</span><span class="ex" style="font-size:44px">Something New</span></div>
  <div class="r"><span class="tok">--text-h1</span><span class="ex" style="font-size:34px">Seven canvases</span></div>
  <div class="r"><span class="tok">--text-h2</span><span class="ex" style="font-size:27px">One is yours</span></div>
  <div class="r"><span class="tok">--text-h3</span><span class="ex" style="font-size:22px">Folds flat, travels far</span></div>
  <div class="r"><span class="tok">--text-lead</span><span class="ex" style="font-size:18px;font-family:var(--font-body);font-weight:500">Your shade. Anywhere.</span></div>
  <div class="r"><span class="tok">--text-body · 17</span><span class="ex" style="font-size:17px;font-family:var(--font-body);font-weight:400">Premium walnut and canvas, made for the beach.</span></div>
  <div class="r"><span class="tok">--text-sm · 15</span><span class="ex" style="font-size:15px;font-family:var(--font-body);font-weight:400;color:var(--ink-60)">No spam. Unsubscribe any time.</span></div>
</body>
</html>
